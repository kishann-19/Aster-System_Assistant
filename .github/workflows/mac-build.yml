name: Test and build Aster for Mac
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node -e "if(process.arch!=='arm64')throw Error('Apple Silicon runner required')"
      - run: npm ci
      - run: npm test
      - run: npm run setup
      - run: npm run package
      - run: node scripts/archive.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Aster-Mac-Apple-Silicon
          path: |
            release/Aster-Mac.zip
            release/SHA256SUMS.txt
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aster-Mac-Apple-Silicon
          path: release
      - name: Publish preview download
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/Aster-Mac.zip release/SHA256SUMS.txt --repo "$REPOSITORY" --prerelease --title "Aster $RELEASE_TAG · Mac preview" --notes "Apple Silicon, macOS 15+. Experimental community build. Ad hoc signed; Apple notarization is not configured. See README and VALIDATION before enabling computer control."
